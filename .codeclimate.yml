---
version: "2"
checks:
  file-lines:
    config:
      threshold: 2000
  method-complexity:
    config:
      threshold: 550
  method-count:
    config:
      threshold: 50
  method-lines:
    config:
      threshold: 250
plugins:
  csslint:
    enabled: true
  duplication:
    enabled: true
    config:
      languages:
      - javascript
      - php
  eslint:
    enabled: true
  fixme:
    enabled: true
  nodesecurity:
    enabled: true
  phpmd:
    enabled: true
    checks:
      Controversial/CamelCaseClassName:
        enabled: false
      Controversial/CamelCaseMethodName:
        enabled: false
      Controversial/CamelCasePropertyName:
        enabled: false
      Controversial/CamelCaseVariableName:
        enabled: false
      Controversial/Superglobals:
        enabled: false
      CleanCode/ElseExpression:
        enabled: false
      CleanCode/StaticAccess:
        enabled: false
  sonar-php:
    enabled: true
    config:
      tests_patterns:
        - tst/**
exclude_patterns:
  - "cfg/"
  - "pub/css/"
  - "!pub/css/privatebin.css"
  - "!pub/css/noscript.css"
  - "!pub/css/bootstrap/privatebin.css"
  - "pub/js/"
  - "!pub/js/privatebin.js"
  - "!pub/js/common.js"
  - "!pub/js/test/"
  - "vendor/"

