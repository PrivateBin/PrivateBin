name: ESLint Check

on:
  push:
    paths:
      - 'pub/js/**/*.js'
      - 'pub/js/package-lock.json'
      - .github/workflows/eslint.yml
  pull_request:
    paths:
      - 'pub/js/**/*.js'
      - 'pub/js/package-lock.json'
      - .github/workflows/eslint.yml

permissions: {}

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f pub/js/package.json ]; then
            cd pub/js && npm ci
          fi

      - name: Run ESLint
        run: |
          if [ -f pub/js/package.json ]; then
            cd pub/js && npx eslint .
          else
            npx eslint pub/js/
          fi
